server {
    server_name diagnostika-anketa.monterium-edu.ru;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/diagnostika-anketa.monterium-edu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diagnostika-anketa.monterium-edu.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    server_name diagnostika-anketa.monterium-edu.ru;
    return 301 https://$host$request_uri;
}
